<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My first vlog - Diamond vs Ruby</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#171a3a,#303b70);color:#fff}
.app{width:min(100%,420px);text-align:center;padding:24px;border-radius:22px;background:rgba(255,255,255,.1);box-shadow:0 12px 35px #0004}
h1{margin:0 0 8px;font-size:27px}.sub{color:#d9defe;margin:0 0 16px}
.legend{display:flex;justify-content:center;gap:22px;margin:14px 0;font-size:17px;font-weight:bold}
#status{min-height:28px;font-size:18px;font-weight:bold;margin:14px 0}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.cell{aspect-ratio:1;border:0;border-radius:14px;font-size:43px;background:#f4f5ff;cursor:pointer}
.cell:disabled{cursor:default}
.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;border:0;border-radius:12px;padding:13px 8px;font-size:15px;font-weight:bold;cursor:pointer}
#reset{background:#ffd166;color:#28213b}#newgame{background:#78e0c3;color:#173b39}
.note{color:#d9defe;font-size:12px;margin:18px 0 0}
</style>
</head>
<body>
<main class="app">
<h1>My first vlog</h1>
<p class="sub">Diamond vs Ruby · Tic-Tac-Toe</p>
<div class="legend"><span>💎 Diamond</span><span>❤️ Ruby</span></div>
<div id="status" role="status" aria-live="polite">💎 Diamond की बारी</div>
<section class="board" aria-label="Tic Tac Toe board">
<button class="cell" aria-label="ऊपर बायाँ"></button><button class="cell" aria-label="ऊपर बीच"></button><button class="cell" aria-label="ऊपर दायाँ"></button>
<button class="cell" aria-label="बीच बायाँ"></button><button class="cell" aria-label="बीच"></button><button class="cell" aria-label="बीच दायाँ"></button>
<button class="cell" aria-label="नीचे बायाँ"></button><button class="cell" aria-label="नीचे बीच"></button><button class="cell" aria-label="नीचे दायाँ"></button>
</section>
<div class="actions"><button id="reset">बोर्ड रीसेट</button><button id="newgame">नया गेम</button></div>
<p class="note">एक फोन पर दो खिलाड़ी खेल सकते हैं। Pi Login और Pi Payment अभी जुड़े नहीं हैं।</p>
</main>
<script>
(() => {
const cells=[...document.querySelectorAll('.cell')],status=document.getElementById('status');
const symbols=['💎','❤️'],wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board=Array(9).fill(''),turn=0,done=false;
function move(i){
 if(done||board[i])return;
 board[i]=symbols[turn];cells[i].textContent=symbols[turn];cells[i].disabled=true;
 if(wins.some(line=>line.every(n=>board[n]===symbols[turn]))){
  status.textContent=(turn===0?'💎 Diamond':'❤️ Ruby')+' जीत गया! 🎉';done=true;cells.forEach(c=>c.disabled=true);
 }else if(board.every(Boolean)){status.textContent='मैच बराबर रहा!';done=true;}
 else{turn=1-turn;status.textContent=(turn===0?'💎 Diamond':'❤️ Ruby')+' की बारी';}
}
function reset(){board=Array(9).fill('');turn=0;done=false;cells.forEach(c=>{c.textContent='';c.disabled=false});status.textContent='💎 Diamond की बारी';}
cells.forEach((c,i)=>c.addEventListener('click',()=>move(i)));
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('newgame').addEventListener('click',reset);
})();
</script>
</body>
</html>
